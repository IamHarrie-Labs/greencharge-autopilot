---
# Source: greencharge/templates/runtimepolicy.yaml
# ENACT RuntimePolicy (Task 4): Soft green >= 0.6, Hard region eu-west,
# node availability >= 0.9. The ENACT operator writes its placement decision to
# status.chosenNode; the autopilot applies it to the running workload.
apiVersion: enact.eu/v1alpha1
kind: RuntimePolicy
metadata:
  name: greencharge-policy
  labels:
    helm.sh/chart: greencharge-0.1.0
    app.kubernetes.io/name: greencharge
    app.kubernetes.io/instance: greencharge
    app: greencharge
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  # The brief places GreenCharge on the green edge node (enact-dev-worker).
  nodeSelector:
    enact.eu/role: edge
  appNamespace: enact
  appLabels:
    app.kubernetes.io/name: greencharge
    app.kubernetes.io/instance: greencharge
    app: greencharge
  cpu:
    min: 1
    max: 4
  memory:
    min: 2048
  availability:
    requireReady: true
    nodeAvailability: 0.9
  location:
    mode: Hard
    regions: ["eu-west"]
  greenEnergy:
    mode: Soft
    minRatio: 0.6
  clusterLatency:
    mode: Soft
    maxAvgMs: 50
