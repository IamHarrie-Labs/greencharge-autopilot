{{- if .Values.autopilot.enabled }}
{{- $name := printf "%s-autopilot" (include "greencharge.fullname" .) }}
# The autopilot runs apart from GreenCharge so that rolling out an adaptation
# never restarts the process that is verifying it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "greencharge.labels" . | nindent 4 }}
---
# Namespaced: adapt the GreenCharge Deployment, read its pods and policy.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ include "greencharge.fullname" . | quote }}]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["enact.eu"]
    resources: ["runtimepolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
# Cluster-scoped: read nodes, to check a move against the policy's Hard rules.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-{{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-{{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ $name }}
      containers:
        - name: autopilot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_OPEN_BROWSER
              value: "false"
            - name: AUTOPILOT_ENABLED
              value: "true"
            - name: AUTOPILOT_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: AUTOPILOT_DEPLOYMENT
              value: {{ include "greencharge.fullname" . | quote }}
            - name: AUTOPILOT_CONTAINER
              value: {{ .Chart.Name | quote }}
            - name: AUTOPILOT_POLICY_NAME
              value: {{ .Values.runtimePolicy.name | quote }}
            - name: AUTOPILOT_HEALTH_URL
              value: "http://{{ include "greencharge.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}/chargers"
            - name: AUTOPILOT_INTERVAL_SECONDS
              value: {{ .Values.autopilot.intervalSeconds | quote }}
            - name: AUTOPILOT_COOLDOWN_SECONDS
              value: {{ .Values.autopilot.cooldownSeconds | quote }}
            - name: AUTOPILOT_VERIFY_TIMEOUT_SECONDS
              value: {{ .Values.autopilot.verifyTimeoutSeconds | quote }}
            - name: AUTOPILOT_DRY_RUN
              value: {{ .Values.autopilot.dryRun | quote }}
          startupProbe:
            httpGet:
              path: /autopilot/status
              port: http
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /autopilot/status
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.autopilot.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
