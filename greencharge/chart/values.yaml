# Default values for greencharge.
# This is a YAML-formatted file.

replicaCount: 1

image:
  # Built locally and loaded into kind: `make image` (see the root README).
  repository: greencharge
  pullPolicy: IfNotPresent
  tag: "1.6"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: NodePort
  port: 8080
  # do not edit the nodePort. Kind is configured to NAT to this nodePort.
  nodePort: 32585

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: greencharge.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Deliberately below the policy model's 1-core minimum: the autopilot detects
# the violation after deployment and scales the limit up to the policy.
resources:
  limits:
    cpu: 500m
    memory: 2Gi
  requests:
    cpu: 100m
    memory: 256Mi

autopilot:
  enabled: true
  dryRun: false
  intervalSeconds: 20
  cooldownSeconds: 60
  verifyTimeoutSeconds: 240
  resources:
    limits:
      cpu: "1"
      memory: 768Mi
    requests:
      cpu: 100m
      memory: 384Mi

runtimePolicy:
  enabled: true
  name: greencharge-policy

env:
  - name: APP_OPEN_BROWSER
    value: "false"

nodeSelector: {}
tolerations: []
affinity: {}

configMap:
  enabled: true
  applicationYaml: |
    server:
      port: 8080
    carbon:
      feed:
        # Mounted from the greencharge-carbon-feed ConfigMap (make carbon-feed).
        # Until that exists the app reports "mock (feed file not found)".
        file: "/app/carbon/grid-carbon-intensity.json"
    app:
      open-browser: false
  applicationProperties: |
    # --- Database Configuration (H2 example) ---
    spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    spring.datasource.driverClassName=org.h2.Driver
    spring.datasource.username=sa
    spring.datasource.password=
    spring.jpa.hibernate.ddl-auto=update
    spring.h2.console.enabled=true
    spring.h2.console.path=/h2-console

    # --- Server & Actuator Ports ---
    server.port=8080
    management.server.port=8081
    management.endpoints.web.exposure.include=health,info,metrics,prometheus

    # --- Swagger UI ---
    springdoc.swagger-ui.path=/swagger-ui.html

    # --- Disable Native Hardware Metrics (Crucial for Non-Linux/Dev Machines) ---
    enact.metrics.enabled=false
    enact.metrics.gpu.enabled=false
    enact.metrics.opencl.enabled=false
