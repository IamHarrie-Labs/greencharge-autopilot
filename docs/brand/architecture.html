<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GreenCharge Autopilot architecture</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<style>
  html, body { margin: 0; background: #f6f5f0; }
  svg { display: block; }
  text { font-family: "Kalam", cursive; fill: #1f2421; }
</style>
</head>
<body>
<svg id="d" width="1600" height="1040" viewBox="0 0 1600 1040" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const svg = document.getElementById("d");
const rc = rough.svg(svg);
const NS = "http://www.w3.org/2000/svg";
const INK = "#1f2421", GREEN = "#0e6b4f", AMBER = "#b7791f", RED = "#b42318", BLUE = "#1d4ed8";
let seed = 7;
const opt = (o) => Object.assign({ roughness: 1.3, bowing: 1.2, stroke: INK, strokeWidth: 1.8, seed: seed++ }, o);

function box(x, y, w, h, o = {}) { svg.appendChild(rc.rectangle(x, y, w, h, opt(o))); }
function text(x, y, s, size = 22, o = {}) {
  const t = document.createElementNS(NS, "text");
  t.setAttribute("x", x); t.setAttribute("y", y); t.setAttribute("font-size", size);
  if (o.weight) t.setAttribute("font-weight", o.weight);
  if (o.fill) t.style.fill = o.fill;
  if (o.anchor) t.setAttribute("text-anchor", o.anchor);
  t.textContent = s; svg.appendChild(t);
}
function arrow(x1, y1, x2, y2, o = {}) {
  svg.appendChild(rc.line(x1, y1, x2, y2, opt(o)));
  const a = Math.atan2(y2 - y1, x2 - x1), L = 16;
  const p1 = [x2 - L * Math.cos(a - 0.45), y2 - L * Math.sin(a - 0.45)];
  const p2 = [x2 - L * Math.cos(a + 0.45), y2 - L * Math.sin(a + 0.45)];
  svg.appendChild(rc.linearPath([p1, [x2, y2], p2], opt(o)));
}
function label(x, y, s, color = INK, size = 18) { text(x, y, s, size, { fill: color }); }

// Title
text(40, 56, "GreenCharge Autopilot", 40, { weight: 700, fill: GREEN });
text(42, 88, "how ENACT advice becomes a verified change on the running app", 22, { fill: "#4a4f4b" });

// Cluster
box(30, 115, 1080, 640, { stroke: "#4a4f4b", strokeLineDash: [10, 8], roughness: 1 });
text(50, 148, "kind cluster  enact-dev  (3 nodes, ENACT components from make setup)", 22, { fill: "#4a4f4b" });

// Worker (edge)
box(55, 450, 470, 280, { fill: "#e3f1ec", fillStyle: "hachure", hachureGap: 14, fillWeight: 0.6 });
text(75, 482, "enact-dev-worker", 24, { weight: 700 });
text(75, 508, "edge · eu-west · green 0.85", 18, { fill: "#4a4f4b" });
box(95, 530, 390, 175, { fill: "#ffffff", fillStyle: "solid" });
text(115, 565, "GreenCharge pod", 26, { weight: 700, fill: GREEN });
text(115, 595, "Spring Boot app, routes EV drivers", 19);
text(115, 620, "to the greenest charger", 19);
text(115, 652, "/chargers  /carbon  /route  /health", 18, { fill: "#4a4f4b" });
text(115, 684, "carbon file mounted at /app/carbon", 18, { fill: "#4a4f4b" });

// Worker2 (cloud) with autopilot
box(560, 450, 520, 280, { fill: "#eef0ec", fillStyle: "hachure", hachureGap: 16, fillWeight: 0.5 });
text(580, 482, "enact-dev-worker2", 24, { weight: 700 });
text(580, 508, "cloud · eu-west · green 0.9", 18, { fill: "#4a4f4b" });
box(600, 530, 450, 175, { fill: "#ffffff", fillStyle: "solid", stroke: GREEN, strokeWidth: 2.4 });
text(620, 565, "GreenCharge Autopilot", 26, { weight: 700, fill: GREEN });
text(620, 595, "ENACT Application Controller inside", 19);
text(620, 620, "(policy model 1 to 4 cores, 2Gi, eu-west)", 18, { fill: "#4a4f4b" });
text(620, 652, "detect, decide, guard, apply,", 19);
text(620, 678, "verify, roll back", 19);

// Operator + TDCME + policy (top of cluster)
box(60, 180, 330, 120, { fill: "#fff7e6", fillStyle: "solid" });
text(80, 215, "ENACT policy operator", 24, { weight: 700 });
text(80, 243, "APPLPM, with our patch", 19, { fill: AMBER });
text(80, 270, "picks a node for the policy", 19);

box(470, 180, 260, 120, { fill: "#ffffff", fillStyle: "solid" });
text(490, 215, "TDCME", 24, { weight: 700 });
text(490, 243, "node availability", 19);
text(490, 270, "and latency metrics", 19);

box(800, 180, 285, 120, { fill: "#ffffff", fillStyle: "solid" });
text(820, 215, "RuntimePolicy", 24, { weight: 700 });
text(820, 243, "Hard eu-west, edge role", 19);
text(820, 270, "Soft green >= 0.6", 19);

// Operator -> TDCME (token fix)
arrow(390, 230, 468, 230, { stroke: AMBER, strokeWidth: 2.2 });
label(392, 215, "token", AMBER, 17);
// Operator -> RuntimePolicy status
svg.appendChild(rc.curve([[225, 300], [400, 360], [700, 360], [930, 302]], opt({ stroke: INK })));
arrow(915, 312, 930, 302);
label(520, 352, "writes status.chosenNode", INK, 18);

// Autopilot reads policy
arrow(940, 528, 940, 304, { stroke: BLUE });
label(950, 392, "reads decision", BLUE, 18);
label(950, 414, "and Hard rules", BLUE, 18);

// Autopilot -> GreenCharge (patch + health)
arrow(600, 600, 488, 600, { stroke: GREEN, strokeWidth: 2.6 });
label(506, 590, "patch", GREEN, 17);
arrow(488, 660, 600, 660, { stroke: BLUE });
label(504, 650, "health", BLUE, 17);

// Kubernetes API note
text(60, 412, "every change goes through the Kubernetes API, limited by RBAC to the greencharge Deployment", 18, { fill: "#4a4f4b" });

// Console
box(660, 790, 420, 110, { fill: "#ffffff", fillStyle: "solid" });
text(680, 828, "Operations console", 24, { weight: 700 });
text(680, 856, "status, ENACT decision, evidence timeline", 19);
text(680, 882, "drills for a rejected move and a rollback", 19);
arrow(870, 790, 870, 708, { stroke: INK });

// SDK
box(60, 790, 560, 200, { fill: "#f0edf9", fillStyle: "hachure", hachureGap: 14, fillWeight: 0.5 });
text(80, 828, "ENACT SDK libraries  (sdk-workflow)", 24, { weight: 700 });
text(80, 860, "Application Packaging  ->  Helm chart + manifests", 19);
text(80, 888, "Application Policies   ->  RuntimePolicy valid against the CRD", 19);
text(80, 916, "Dataspaces             ->  catalog, negotiate, transfer", 19);
text(80, 950, "the same libraries the Eclipse SDK modules wrap", 18, { fill: "#4a4f4b" });
arrow(300, 790, 300, 708, { stroke: INK });
label(310, 770, "deploys", INK, 17);

// Dataspace (right)
box(1150, 180, 410, 560, { stroke: "#4a4f4b", strokeLineDash: [10, 8], roughness: 1 });
text(1170, 215, "ENACT Data & Object Space", 24, { weight: 700 });
box(1180, 245, 350, 95, { fill: "#ffffff", fillStyle: "solid" });
text(1198, 280, "consumer connector", 21, { weight: 700 });
text(1198, 308, "sovity2-api.sedimark.work", 18, { fill: "#4a4f4b" });
box(1180, 395, 350, 95, { fill: "#ffffff", fillStyle: "solid" });
text(1198, 430, "provider connector", 21, { weight: 700 });
text(1198, 458, "grid-carbon-intensity offer", 18, { fill: "#4a4f4b" });
box(1180, 545, 350, 95, { fill: "#fdecea", fillStyle: "solid", stroke: RED });
text(1198, 580, "transfer relay", 21, { weight: 700, fill: RED });
text(1198, 608, "answers 400, download blocked", 18, { fill: RED });
arrow(1355, 340, 1355, 393);
label(1365, 372, "negotiation FINALIZED", INK, 17);
arrow(1355, 490, 1355, 543);
label(1365, 522, "transfer COMPLETED", INK, 17);
// relay -> carbon file (dashed, blocked)
svg.appendChild(rc.curve([[1180, 625], [1128, 742], [800, 744], [430, 744], [400, 708]], opt({ stroke: RED, strokeLineDash: [8, 8] })));
arrow(404, 716, 400, 708, { stroke: RED });
label(560, 772, "carbon file, once the relay works", RED, 17);
// SDK -> consumer connector
svg.appendChild(rc.curve([[620, 900], [1000, 960], [1300, 900], [1355, 745]], opt({ stroke: "#6b4fbf" })));
arrow(1350, 760, 1355, 742, { stroke: "#6b4fbf" });
label(1060, 930, "make sdk-dataspace", "#6b4fbf", 18);

// Footer
text(40, 1025, "Hand-drawn overview. Exact flows, states and evidence are in the README and docs/evidence.", 17, { fill: "#4a4f4b" });
document.body.setAttribute("data-ready", "1");
</script>
</body>
</html>
