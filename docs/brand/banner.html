<!doctype html><html><head><meta charset="utf-8"><title>GreenCharge Autopilot banner</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
.b{width:1920px;height:1080px;position:relative;overflow:hidden;font-family:"Hanken Grotesk",sans-serif;
 background:radial-gradient(1200px 900px at 85% 40%,#1a8a66 0%,#0e6b4f 35%,#0a3f30 75%,#082c22 100%);color:#fff}
.ring{position:absolute;right:-170px;top:90px;width:1000px;height:1000px;opacity:.16}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:64px 64px}
.c{position:absolute;left:140px;top:150px;width:1150px}
.mark{display:flex;align-items:center;gap:28px;margin-bottom:70px}
.mark .tile{width:120px;height:120px;border-radius:28px;background:#fff;display:flex;align-items:center;justify-content:center}
.mark .tile svg{width:80px;height:80px}
.mark span{font-size:30px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#c8f0dc}
h1{font-size:132px;line-height:.98;margin:0 0 40px;font-weight:800;letter-spacing:-.025em}
p{font-size:42px;line-height:1.3;margin:0;color:#e3f4ec;font-weight:400;max-width:960px}
.chips{position:absolute;left:140px;bottom:120px;display:flex;gap:18px}
.chip{font-size:26px;font-weight:500;padding:14px 26px;border-radius:999px;border:2px solid rgba(200,240,220,.5);color:#e3f4ec}
.chip.on{background:#fff;color:#0b5a42;border-color:#fff;font-weight:700}
.foot{position:absolute;right:140px;bottom:132px;font-size:26px;color:#a9d8c3}
</style></head><body><div class="b">
<div class="grid"></div>
<svg class="ring" viewBox="0 0 64 64"><path d="M32 6a26 26 0 1 1-22.5 13" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M3.5 14.5 L13.5 22.5 L15.8 10.2 Z" fill="#fff"/><path d="M35.5 15 L22 35h9l-3 14 14.5-21h-9.2l2.2-13z" fill="#fff"/></svg>
<div class="c">
 <div class="mark"><div class="tile"><svg viewBox="0 0 64 64"><path d="M32 6a26 26 0 1 1-22.5 13" fill="none" stroke="#0E6B4F" stroke-width="6" stroke-linecap="round"/><path d="M3.5 14.5 L13.5 22.5 L15.8 10.2 Z" fill="#0E6B4F"/><path d="M35.5 15 L22 35h9l-3 14 14.5-21h-9.2l2.2-13z" fill="#0E6B4F"/></svg></div><span>Veles Hack 2026 · Challenge 3 ENACT</span></div>
 <h1>GreenCharge<br>Autopilot</h1>
 <p>ENACT policies that change the running app on Kubernetes and roll back when a change fails.</p>
</div>
<div class="chips"><div class="chip on">Detect</div><div class="chip">Decide</div><div class="chip">Guard</div><div class="chip">Apply</div><div class="chip">Verify</div><div class="chip">Roll back</div></div>
<div class="foot">Team Harrie</div>
</div></body></html>
